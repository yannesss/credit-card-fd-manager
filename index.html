<!doctype html><html lang="zh-HK"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>信用卡・定期管理</title><style>body{margin:0;background:#f3f7f4;font-family:-apple-system,"PingFang HK",sans-serif;color:#17221b}.app{max-width:760px;margin:auto;padding:14px}.box,.tx{background:white;border:1px solid #dce6df;border-radius:14px;padding:14px;margin:10px 0}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.num{font-size:21px;font-weight:bold}.muted{font-size:13px;color:#69736c}.btn,.tab{border:0;border-radius:9px;padding:10px 12px;background:#12613a;color:#fff;font-weight:bold}.tab{background:#e7eee8;color:#17221b}.tab.on{background:#12613a;color:#fff}.tag{background:#fff0f0;color:#b52d2d;border-radius:20px;padding:4px 8px;font-size:12px;font-weight:bold}.row{display:flex;justify-content:space-between;gap:8px;margin:7px 0}.hide{display:none}.paid{opacity:.68}.notice{background:#fff8e5;border:1px solid #f1d996}</style><body><main class="app"><div class="bar"><div><h1>信用卡・定期管理 💳</h1><span class="muted">版本 2026.09.13｜資料以預計／已確認標示</span></div><button class="btn" id="refresh">↻ 更新</button></div><div class="grid"><div class="box">未還總額<div class="num" id="out">$0</div></div><div class="box">7日內預計 Due<div class="num" id="soon">$0</div></div><div class="box">未收利息<div class="num" id="pending">$0</div></div><div class="box">已收利息<div class="num" id="received">$0</div></div></div><div class="box"><b>信用卡周期</b><div id="cards"></div></div><div class="bar"><div><button class="tab on" data-f="all">全部交易</button> <button class="tab" data-f="open">未還</button> <button class="tab" data-f="paid">已還</button></div></div><div id="list"></div></main><script src="app.js?v=20"></script></body></html>

<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>信用卡・定期管理</title><style>:root{--ink:#17221b;--green:#12613a;--pale:#f4f7f4;--line:#dce6df;--muted:#657167}*{box-sizing:border-box}body{margin:0;background:var(--pale);font:15px -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",sans-serif;color:var(--ink)}main,section{max-width:700px;margin:auto;padding:16px 16px 90px}.box,article,form{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin:11px 0;box-shadow:0 2px 9px #18351a08}.hero{display:flex;justify-content:space-between;gap:12px;align-items:center}.hero h1{font-size:27px;margin:0}.status{font-size:13px;color:var(--muted);margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{margin:0}.metric small{color:var(--muted);display:block}.num{font-size:22px;font-weight:750;margin-top:5px}button{appearance:none;border:0;border-radius:10px;padding:10px 12px;background:#e7eee8;color:var(--ink);font:inherit;font-weight:650;cursor:pointer}button.main{background:var(--green);color:#fff}button.danger{background:#ffeaea;color:#a11616}.hide{display:none!important}input,select,textarea{width:100%;margin:4px 0 11px;padding:11px;border:1px solid #cad7cd;border-radius:9px;background:#fff;font:inherit;color:var(--ink)}textarea{min-height:70px;resize:vertical}label{font-size:13px;font-weight:700}.check{display:flex;gap:7px;align-items:center;margin:3px 0 10px}.check input{width:auto;margin:0}.row{display:flex;justify-content:space-between;gap:9px;align-items:center}.row.wrap{flex-wrap:wrap}.cards .row{padding:11px 0;border-bottom:1px solid #edf1ed}.cards .row:last-child{border:0}.muted{font-size:13px;color:var(--muted)}.tabs{display:flex;gap:7px;margin:9px 0}.tabs button.active{background:var(--green);color:#fff}.txn{border-left:5px solid #c95050}.txn.paid{border-left-color:#3b9a60;opacity:.8}.txn p{margin:7px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}#err{color:#b00020;white-space:pre-wrap}@media(min-width:560px){.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}}</style></head><body><section id="login"><div class="box"><h1>信用卡・定期管理</h1><p>登入後，資料只會同步到你自己的帳戶。</p><button class="main" id="signin">使用 Google 登入</button><p id="err"></p></div></section><main id="app" class="hide"><div class="hero"><h1>信用卡・定期管理</h1><button id="signout">登出</button></div><div class="box status" id="saved">同步中…</div><div class="grid"><div class="box metric"><small>未還總額</small><div class="num" id="out">HK$0</div></div><div class="box metric"><small>7 日內 Due</small><div class="num" id="soon">HK$0</div></div><div class="box metric"><small>未收利息</small><div class="num" id="pend">HK$0</div></div><div class="box metric"><small>已收利息</small><div class="num" id="got">HK$0</div></div></div><div class="box"><b>信用卡周期</b><div class="cards" id="cards"></div></div><div class="box"><h2>新增／編輯交易</h2><form id="form"><input id="id" type="hidden"><div class="formgrid"><div><label>信用卡</label><select id="card"><option>HSBC •••• 1326</option><option>SC BANK •••• 1507</option><option>DBS •••• 6003</option><option>HANG SENG •••• 4505</option></select></div><div><label>交易日期 *</label><input id="date" type="date" required></div><div><label>金額（HK$）*</label><input id="amt" type="number" min="0" step="0.01" required></div><div><label>Due 日期</label><input id="due" type="date"></div><div><label>定期到期日</label><input id="fd" type="date"></div><div><label>利息金額（HK$）</label><input id="interest" type="number" min="0" step="0.01" value="0"></div><div class="check"><input id="received" type="checkbox"><label for="received">利息已收</label></div><div class="check"><input id="paid" type="checkbox"><label for="paid">已還款</label></div><div><label>實際還款日</label><input id="repay" type="date"></div><div class="full"><label>備註</label><textarea id="note" placeholder="例如：餐飲、旅遊、定期本金…"></textarea></div></div><div class="actions"><button class="main" type="submit">儲存交易</button><button class="danger hide" type="button" id="del">刪除</button><button type="button" id="cancel">取消</button></div></form></div><div class="box"><h2>交易紀錄</h2><input id="q" placeholder="搜尋信用卡、備註或金額"><div class="tabs"><button class="active" data-f="all">全部</button><button data-f="open">未還</button><button data-f="paid">已還</button></div><div id="list"></div></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js';import{getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot}from'https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js';const cfg={apiKey:'AIzaSyBaC_HqrjAyQ0shh9mDtYAcNlE0EapORp8',authDomain:'credit-card-fd-manager.firebaseapp.com',projectId:'credit-card-fd-manager',appId:'1:350413127111:web:af03eeb7deb7f94173ede2'};const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);const CARDS=[['HSBC','1326','18 AUG','14 SEP','HK$89,000','HK$3,000'],['SC BANK','1507','10 AUG','06 SEP','HK$21,000','HK$20,000'],['DBS','6003','22 AUG','18 SEP','HK$60,000','HK$10,000'],['HANG SENG','4505','15 AUG','10 SEP','HK$32,000','不可套現']];let uid='',data=[],filter='all';const $=id=>document.getElementById(id);const money=x=>'HK$'+(+x||0).toLocaleString('en-HK',{maximumFractionDigits:2});const date=x=>x?new Date(x+'T00:00:00').toLocaleDateString('zh-HK'):'—';const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const open=data.filter(x=>!x.paid),sum=a=>a.reduce((n,x)=>n+(+x.amt||0),0),today=new Date();today.setHours(0,0,0,0);$('out').textContent=money(sum(open));$('soon').textContent=money(sum(open.filter(x=>{if(!x.due)return false;const d=new Date(x.due+'T00:00:00')-today;return d>=0&&d<7*86400000})));$('pend').textContent=money(data.filter(x=>+x.interest&&!x.received).reduce((n,x)=>n+(+x.interest||0),0));$('got').textContent=money(data.filter(x=>+x.interest&&x.received).reduce((n,x)=>n+(+x.interest||0),0));$('cards').innerHTML=CARDS.map(c=>`<div class="row"><span><b>${c[0]} •••• ${c[1]}</b><br><span class="muted">結單 ${c[2]}｜Due ${c[3]}</span></span><span class="muted">額度 ${c[4]}<br>每期 ${c[5]}</span></div>`).join('');const q=$('q').value.trim().toLowerCase();const shown=data.filter(x=>(filter==='all'||filter==='open'&&!x.paid||filter==='paid'&&x.paid)&&JSON.stringify(x).toLowerCase().includes(q)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));$('list').innerHTML=shown.map(x=>`<article class="txn ${x.paid?'paid':''}"><div class="row"><b>${esc(x.card)}</b><span>${x.paid?'已還':'未還'}</span></div><p>${date(x.date)}｜<b>${money(x.amt)}</b></p><p>Due：${date(x.due)}${x.paid?'｜還款：'+date(x.repay):''}</p><p>定期到期：${date(x.fd)}｜利息：${money(x.interest)}${x.received?'（已收）':''}</p>${x.note?`<p class="muted">${esc(x.note)}</p>`:''}<button data-edit="${x.id}">編輯</button></article>`).join('')||'<p class="muted">未有紀錄；請在上方新增交易。</p>'}function reset(x={}){$('id').value=x.id||'';$('card').value=x.card||'HSBC •••• 1326';$('date').value=x.date||new Date().toISOString().slice(0,10);$('amt').value=x.amt||'';$('due').value=x.due||'';$('fd').value=x.fd||'';$('interest').value=x.interest||0;$('received').checked=!!x.received;$('paid').checked=!!x.paid;$('repay').value=x.repay||'';$('note').value=x.note||'';$('del').classList.toggle('hide',!x.id)}$('signin').onclick=()=>{$('err').textContent='';signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>$('err').textContent='登入失敗：'+e.code)};$('signout').onclick=()=>signOut(auth);onAuthStateChanged(auth,user=>{if(!user){$('login').classList.remove('hide');$('app').classList.add('hide');return}uid=user.uid;$('login').classList.add('hide');$('app').classList.remove('hide');reset();onSnapshot(collection(db,'users',uid,'transactions'),snap=>{data=snap.docs.map(d=>d.data());render();$('saved').textContent='✓ 雲端已同步｜'+new Date().toLocaleString('zh-HK',{hour12:false})},e=>$('saved').textContent='同步錯誤：'+e.message)});$('form').onsubmit=async e=>{e.preventDefault();const x={id:$('id').value||crypto.randomUUID(),card:$('card').value,date:$('date').value,amt:$('amt').value,due:$('due').value,fd:$('fd').value,interest:$('interest').value||0,received:$('received').checked,paid:$('paid').checked,repay:$('repay').value,note:$('note').value,updated:Date.now()};await setDoc(doc(db,'users',uid,'transactions',x.id),x);reset()};$('cancel').onclick=()=>reset();$('del').onclick=async()=>{const id=$('id').value;if(id&&confirm('確定刪除這筆交易？')){await deleteDoc(doc(db,'users',uid,'transactions',id));reset()}};$('list').onclick=e=>{const id=e.target.dataset.edit;if(id){const x=data.find(i=>i.id===id);if(x){reset(x);window.scrollTo({top:0,behavior:'smooth'})}}};$('q').oninput=render;document.querySelector('.tabs').onclick=e=>{const v=e.target.dataset.f;if(v){filter=v;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.f===v));render()}};</script></body></html>

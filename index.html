<!doctype html><html lang="zh-HK"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>信用卡・定期管理</title><style>body{margin:auto;max-width:700px;padding:15px 15px 80px;background:#f4f7f4;font:15px -apple-system,"PingFang HK",sans-serif;color:#17221b}.box,article,form{background:#fff;border:1px solid #dce6df;border-radius:14px;padding:13px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.n{font-size:21px;font-weight:bold}button{border:0;border-radius:9px;padding:10px;background:#e7eee8;font:inherit;font-weight:bold}button.main{background:#12613a;color:#fff}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:9px;text-align:center;border-top:1px solid #dce6df}.hide{display:none}input,select,textarea{box-sizing:border-box;width:100%;margin:4px 0 10px;padding:10px;border:1px solid #cad7cd;border-radius:8px;font:inherit}label{font-size:13px;font-weight:bold}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.muted{font-size:13px;color:#657167}.open{border-left:4px solid #c95050}.paid{border-left:4px solid #3b9a60;opacity:.72}</style><body><section id="home"><div class="row"><h1>信用卡・定期管理</h1><button class="main" onclick="edit()">＋新增</button></div><div class="box" id="saved">尚未儲存</div><div class="grid"><div class="box">未還總額<div class="n" id="out">$0</div></div><div class="box">7日內 Due<div class="n" id="soon">$0</div></div><div class="box">未收利息<div class="n" id="pend">$0</div></div><div class="box">已收利息<div class="n" id="got">$0</div></div></div></section><section id="list" class="hide"><div class="row"><h1>交易</h1><button class="main" onclick="edit()">＋新增</button></div><input id="q" oninput="render()" placeholder="搜尋銀行、備註或金額"><p><button onclick="f='all';render()">全部</button> <button onclick="f='open';render()">未還</button> <button onclick="f='paid';render()">已還</button></p><div id="items"></div></section><section id="formpg" class="hide"><div class="row"><h1 id="ttl">新增交易</h1><button onclick="page('list')">取消</button></div><form onsubmit="store(event)"><input id="id" type="hidden"><label>信用卡</label><select id="card"><option>HSBC •••• 1326</option><option>SC BANK •••• 1507</option><option>DBS •••• 6003</option><option>HANG SENG •••• 4505</option></select><label>交易日期 *</label><input id="date" type="date" required><label>金額（HK$）*</label><input id="amt" type="number" min="0" step=".01" required><label>Due 日期</label><input id="due" type="date"><label>定期到期日</label><input id="fd" type="date"><label>利息金額（HK$）</label><input id="interest" type="number" min="0" step=".01" value="0"><label><input id="received" type="checkbox" style="width:auto"> 利息已收</label><br><label><input id="paid" type="checkbox" style="width:auto"> 已還款</label><label>實際還款日</label><input id="repay" type="date"><label>備註</label><textarea id="note"></textarea><button class="main">儲存交易</button> <button type="button" onclick="del()">刪除</button></form></section><section id="set" class="hide"><h1>設定</h1><div class="box"><b>Google 雲端同步</b><p>未設定 Firebase 前，Google 登入及跨裝置同步未啟用。交易資料不會上傳 GitHub。</p></div><div class="box"><button onclick="backup()">↓ 匯出備份</button> <button onclick="document.querySelector('#file').click()">↑ 匯入備份</button><input id="file" class="hide" type="file" accept="application/json" onchange="restore(this)"></div></section><nav class="nav"><button onclick="page('home')">總覽</button> <button onclick="page('list')">交易</button> <button class="main" onclick="edit()">＋新增</button> <button onclick="page('set')">設定</button></nav><script>let D=JSON.parse(localStorage.ccfd||'[]'),f='all',now=localStorage.ccfdtime||'';const $=x=>document.getElementById(x),M=x=>'$'+(+x||0).toLocaleString('en-HK'),P=x=>x?new Date(x+'T00:00:00').toLocaleDateString('zh-HK'):'—';function page(x){['home','list','formpg','set'].forEach(y=>$(y).classList.toggle('hide',x!=y));render()}function save(){now=new Date().toISOString();localStorage.ccfd=JSON.stringify(D);localStorage.ccfdtime=now}function render(){let o=D.filter(x=>!x.paid),sum=a=>a.reduce((s,x)=>s+(+x.amt||0),0),today=new Date;today.setHours(0,0,0,0);$('out').textContent=M(sum(o));$('soon').textContent=M(sum(o.filter(x=>x.due&&new Date(x.due+'T00:00:00')-today<6048e5&&new Date(x.due+'T00:00:00')>=today)));$('pend').textContent=M(sum(D.filter(x=>x.interest&&!x.received)));$('got').textContent=M(sum(D.filter(x=>x.interest&&x.received)));$('saved').textContent=now?'✓ 已自動儲存｜最後更新：'+new Date(now).toLocaleString('zh-HK',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}):'尚未儲存';let q=$('q').value.toLowerCase();$('items').innerHTML=D.filter(x=>(f=='all'||f=='open'&&!x.paid||f=='paid'&&x.paid)&&JSON.stringify(x).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<article class="${x.paid?'paid':'open'}"><div class="row"><b>${x.card}</b><button onclick="edit('${x.id}')">編輯</button></div><p>${P(x.date)}｜<b>${M(x.amt)}</b></p><p>Due：${P(x.due)}｜定期：${P(x.fd)}</p><p>利息：${M(x.interest)}${x.received?'（已收）':''}${x.paid?'｜已還':''}</p><div class="muted">${x.note||''}</div></article>`).join('')||'<div class="box">未有交易；按「＋新增」開始。</div>'}function edit(id){let x=D.find(y=>y.id==id)||{id:'',date:new Date().toISOString().slice(0,10),card:'HSBC •••• 1326',amt:'',due:'',fd:'',interest:0,received:false,paid:false,repay:'',note:''};$('ttl').textContent=id?'編輯交易':'新增交易';for(let k of ['id','date','card','due','fd','interest','repay','note'])$(k).value=x[k]||'';$('amt').value=x.amt;$('received').checked=x.received;$('paid').checked=x.paid;page('formpg')}function store(e){e.preventDefault();let x={id:$('id').value||crypto.randomUUID(),card:$('card').value,date:$('date').value,amt:$('amt').value,due:$('due').value,fd:$('fd').value,interest:$('interest').value,received:$('received').checked,paid:$('paid').checked,repay:$('repay').value,note:$('note').value};let i=D.findIndex(y=>y.id==x.id);i<0?D.push(x):D[i]=x;save();page('list')}function del(){let id=$('id').value;if(id&&confirm('確定刪除？')){D=D.filter(x=>x.id!=id);save();page('list')}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)]));a.download='credit-card-backup.json';a.click()}function restore(i){let r=new FileReader;r.onload=()=>{try{D=JSON.parse(r.result);save();render();alert('已匯入')}catch(e){alert('備份檔無效')}};r.readAsText(i.files[0])}render()</script>

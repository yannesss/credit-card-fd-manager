<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>信用卡・定期管理</title><style>:root{--ink:#17221b;--green:#12613a;--pale:#f4f7f4;--line:#dce6df;--muted:#657167}*{box-sizing:border-box}body{margin:0;background:var(--pale);font:15px -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",sans-serif;color:var(--ink)}main,section{max-width:700px;margin:auto;padding:16px 16px 90px}.box,article,form{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin:11px 0;box-shadow:0 2px 9px #18351a08}.hero,.row{display:flex;justify-content:space-between;gap:9px;align-items:center}.hero h1{font-size:27px;margin:0}.status,.muted{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{margin:0}.metric small{color:var(--muted);display:block}.num{font-size:22px;font-weight:750;margin-top:5px}h2{font-size:20px;margin:0 0 10px}button{appearance:none;border:0;border-radius:10px;padding:10px 12px;background:#e7eee8;color:var(--ink);font:inherit;font-weight:650;cursor:pointer}button.main{background:var(--green);color:#fff}button.danger{background:#ffeaea;color:#a11616}button.active{background:var(--green);color:#fff}.hide{display:none!important}input,select,textarea{width:100%;margin:4px 0 11px;padding:11px;border:1px solid #cad7cd;border-radius:9px;background:#fff;font:inherit;color:var(--ink)}textarea{min-height:70px;resize:vertical}label{font-size:13px;font-weight:700}.check{display:flex;gap:7px;align-items:center;margin:3px 0 10px}.check input{width:auto;margin:0}.tabs,.actions{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}.txn{border-left:5px solid #c95050}.txn.paid{border-left-color:#3b9a60;opacity:.8}.txn p{margin:7px 0}.month{margin:20px 0 8px;padding:8px 2px;border-bottom:2px solid #bdd4c3;color:#12613a}.month:first-child{margin-top:2px}.month small{float:right;color:var(--muted);font-weight:500}.alert{background:#fff4e5;border:1px solid #f0c47a;color:#7a4a00;border-radius:14px;padding:13px;margin:11px 0}.alert b{display:block;margin-bottom:6px}.alert p{margin:4px 0;font-size:14px}.nav{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 15px;margin:11px 0}.nav a{color:var(--green);font-weight:700;text-decoration:none}@media(min-width:560px){.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}}</style></head><body><section id="login"><div class="box"><h1>信用卡・定期管理</h1><p>登入後，資料只會同步到你自己的帳戶。</p><button class="main" id="signin">使用 Google 登入</button><p id="err"></p></div></section><main id="app" class="hide"><div class="hero"><h1>信用卡・定期管理</h1><button id="signout">登出</button></div><div class="box status" id="saved">同步中…</div><div id="alerts"></div><div class="nav"><span>信用卡周期／管理</span><a href="cards.html">前往 →</a></div><div class="grid"><div class="box metric"><small>未還總額</small><div class="num" id="out">HK$0</div></div><div class="box metric"><small>7 日內 Due</small><div class="num" id="soon">HK$0</div></div><div class="box metric"><small>未收利息</small><div class="num" id="pend">HK$0</div></div><div class="box metric"><small>已收利息</small><div class="num" id="got">HK$0</div></div></div><div class="box"><h2>新增／編輯交易</h2><form id="form"><input id="id" type="hidden"><div class="formgrid"><div><label>信用卡</label><select id="card"></select></div><div><label>交易日期 *</label><input id="date" type="date" required></div><div><label>金額（HK$）*</label><input id="amt" type="number" min="0" step="0.01" required></div><div><label>Due 日期</label><input id="due" type="date"></div><div><label>定期到期日</label><input id="fd" type="date"></div><div><label>利息金額（HK$）</label><input id="interest" type="number" min="0" step="0.01" value="0"></div><div class="check"><input id="received" type="checkbox"><label for="received">利息已收</label></div><div class="check"><input id="paid" type="checkbox"><label for="paid">已還款</label></div><div><label>實際還款日</label><input id="repay" type="date"></div><div class="full"><label>備註</label><textarea id="note" placeholder="例如：餐飲、旅遊、定期本金…"></textarea></div></div><div class="actions"><button class="main" type="submit">儲存交易</button><button class="danger hide" type="button" id="del">刪除</button><button type="button" id="cancel">取消</button></div></form></div><div class="box"><h2>交易紀錄</h2><input id="q" placeholder="搜尋信用卡、備註或金額"><div class="tabs"><button class="active" data-f="all">全部</button><button data-f="open">未還</button><button data-f="paid">已還</button></div><div id="list"></div></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js';import{getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot,getDocs}from'https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js';const cfg={apiKey:'AIzaSyBaC_HqrjAyQ0shh9mDtYAcNlE0EapORp8',authDomain:'credit-card-fd-manager.firebaseapp.com',projectId:'credit-card-fd-manager',appId:'1:350413127111:web:af03eeb7deb7f94173ede2'};const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);const defaults=[['hsbc1326','HSBC','1326',18,14,89000,3000],['sc1507','SC BANK','1507',10,6,21000,20000],['dbs6003','DBS','6003',22,18,60000,10000],['hang4505','HANG SENG','4505',15,10,32000,0]];const ALERT_DAYS=3;let uid='',data=[],cards=[],filter='all';const $=id=>document.getElementById(id),money=x=>'HK$'+(+x||0).toLocaleString('en-HK',{maximumFractionDigits:2}),esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const label=c=>`${c.name} •••• ${c.last4}`;function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}function localISO(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(Math.min(d,daysInMonth(y,m))).padStart(2,'0')}`}function localFmt(iso){if(!iso)return '—';const[a,m,d]=iso.split('-').map(Number);return `${d}/${m}/${a}`}function todayParts(){const n=new Date();return[n.getFullYear(),n.getMonth(),n.getDate()]}function nextStatement(day){if(!day)return '';let[y,m,t]=todayParts(),x=localISO(y,m,+day);if(+x.slice(-2)<t){m++;if(m===12){m=0;y++}x=localISO(y,m,+day)}return x}function dueForStatement(statementISO,dueDay){if(!statementISO||!dueDay)return '';let[y,m]=statementISO.split('-').map(Number);m++;if(m===13){m=1;y++}return localISO(y,m-1,+dueDay)}function nextCycle(c){const statement=nextStatement(c.statementDay);return{statement,due:dueForStatement(statement,c.dueDay)}}function daysUntil(iso){if(!iso)return null;const today=localISO(...todayParts());return Math.round((new Date(iso+'T00:00:00').getTime()-new Date(today+'T00:00:00').getTime())/86400000)}function findCard(v){return cards.find(c=>label(c)===v)}function populate(selected=''){const active=cards.filter(c=>c.active!==false);$('card').innerHTML=active.map(c=>`<option value="${esc(label(c))}">${esc(label(c))}</option>`).join('');if(selected&&[...$('card').options].some(o=>o.value===selected))$('card').value=selected}function txnForm(x={}){$('id').value=x.id||'';populate(x.card||'');if(!$('card').value&&cards[0])$('card').value=label(cards[0]);$('date').value=x.date||localISO(...todayParts());$('amt').value=x.amt||'';const c=findCard($('card').value);$('due').value=x.due||(c?nextCycle(c).due:'');$('fd').value=x.fd||'';$('interest').value=x.interest||0;$('received').checked=!!x.received;$('paid').checked=!!x.paid;$('repay').value=x.repay||'';$('note').value=x.note||'';$('del').classList.toggle('hide',!x.id)}function txnHTML(x){return`<article class="txn ${x.paid?'paid':''}"><div class="row"><b>${esc(x.card)}</b><span>${x.paid?'已還':'未還'}</span></div><p>${localFmt(x.date)}｜<b>${money(x.amt)}</b></p><p>Due：${localFmt(x.due)}${x.paid?'｜還款：'+localFmt(x.repay):''}</p><p>定期到期：${localFmt(x.fd)}｜利息：${money(x.interest)}${x.received?'（已收）':''}</p>${x.note?`<p class="muted">${esc(x.note)}</p>`:''}<button data-edit="${x.id}">編輯</button></article>`}function renderAlerts(){const items=[];cards.filter(c=>c.active!==false).forEach(c=>{const k=nextCycle(c);const dd=daysUntil(k.due);if(dd!==null&&dd>=0&&dd<=ALERT_DAYS)items.push(`${esc(label(c))} 將於 ${dd===0?'今日':dd+' 日後'}（${localFmt(k.due)}）到 Due`)});data.filter(x=>!x.paid&&x.due).forEach(x=>{const dd=daysUntil(x.due);if(dd!==null&&dd>=0&&dd<=ALERT_DAYS)items.push(`${esc(x.card)} 交易 ${money(x.amt)} 將於 ${dd===0?'今日':dd+' 日後'}（${localFmt(x.due)}）到 Due`)});$('alerts').innerHTML=items.length?`<div class="alert"><b>⚠️ ${items.length} 項提醒</b>${items.map(t=>`<p>${t}</p>`).join('')}</div>`:''}function render(){const open=data.filter(x=>!x.paid),sum=a=>a.reduce((n,x)=>n+(+x.amt||0),0),today=localISO(...todayParts());$('out').textContent=money(sum(open));$('soon').textContent=money(sum(open.filter(x=>x.due&&x.due>=today&&new Date(x.due+'T00:00:00').getTime()-new Date(today+'T00:00:00').getTime()<604800000)));$('pend').textContent=money(data.filter(x=>+x.interest&&!x.received).reduce((n,x)=>n+(+x.interest||0),0));$('got').textContent=money(data.filter(x=>+x.interest&&x.received).reduce((n,x)=>n+(+x.interest||0),0));renderAlerts();const q=$('q').value.trim().toLowerCase(),shown=data.filter(x=>(filter==='all'||filter==='open'&&!x.paid||filter==='paid'&&x.paid)&&JSON.stringify(x).toLowerCase().includes(q)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));const groups={};shown.forEach(x=>{const key=(x.date||'').slice(0,7)||'未設日期';(groups[key]??=[]).push(x)});$('list').innerHTML=Object.keys(groups).sort((a,b)=>b.localeCompare(a)).map(key=>{const g=groups[key],title=key==='未設日期'?key:(()=>{const[y,m]=key.split('-');return`${y} 年 ${+m} 月`})();return`<div class="month"><b>${title}</b><small>${g.length} 筆｜${money(sum(g))}</small></div>${g.map(txnHTML).join('')}`}).join('')||'<p class="muted">未有紀錄；請在上方新增交易。</p>'}async function ensureDefaults(){const s=await getDocs(collection(db,'users',uid,'cards'));if(!s.empty)return;await Promise.all(defaults.map(([id,name,last4,statementDay,dueDay,limit,cash])=>setDoc(doc(db,'users',uid,'cards',id),{id,name,last4,statementDay,dueDay,limit,cash,active:true,created:Date.now()})))}$('signin').onclick=()=>{$('err').textContent='';signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>$('err').textContent='登入失敗：'+e.code)};$('signout').onclick=()=>signOut(auth);onAuthStateChanged(auth,async user=>{if(!user){$('login').classList.remove('hide');$('app').classList.add('hide');return}uid=user.uid;$('login').classList.add('hide');$('app').classList.remove('hide');await ensureDefaults();onSnapshot(collection(db,'users',uid,'cards'),s=>{cards=s.docs.map(d=>d.data());populate();txnForm();render()});onSnapshot(collection(db,'users',uid,'transactions'),s=>{data=s.docs.map(d=>d.data());render();$('saved').textContent='✓ 雲端已同步｜'+new Date().toLocaleString('zh-HK',{hour12:false})},e=>$('saved').textContent='同步錯誤：'+e.message)});$('card').onchange=()=>{if(!$('id').value){const c=findCard($('card').value);$('due').value=c?nextCycle(c).due:''}};$('form').onsubmit=async e=>{e.preventDefault();const x={id:$('id').value||crypto.randomUUID(),card:$('card').value,date:$('date').value,amt:$('amt').value,due:$('due').value,fd:$('fd').value,interest:$('interest').value||0,received:$('received').checked,paid:$('paid').checked,repay:$('repay').value,note:$('note').value,updated:Date.now()};await setDoc(doc(db,'users',uid,'transactions',x.id),x);txnForm()};$('cancel').onclick=()=>txnForm();$('del').onclick=async()=>{const id=$('id').value;if(id&&confirm('確定刪除這筆交易？')){await deleteDoc(doc(db,'users',uid,'transactions',id));txnForm()}};$('list').onclick=e=>{const id=e.target.dataset.edit;if(id){const x=data.find(i=>i.id===id);if(x){txnForm(x);window.scrollTo({top:document.querySelector('#form').getBoundingClientRect().top+scrollY-20,behavior:'smooth'})}}};$('q').oninput=render;document.querySelector('.tabs').onclick=e=>{const v=e.target.dataset.f;if(v){filter=v;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.f===v));render()}};</script></body></html>

<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>信用卡・定期管理</title><style>body{font-family:-apple-system,"PingFang HK",sans-serif;margin:0;background:#f4f7f4;color:#17221b}.app{max-width:1100px;margin:auto;padding:18px}h1{margin:0}.sub,.muted{color:#68736b;font-size:13px}.bar,.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin:15px 0}.panel,.box{background:#fff;border:1px solid #e1e8e2;border-radius:14px;padding:14px;margin-bottom:14px}.stats,.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.box b{font-size:22px;display:block;margin-top:6px}.card{border:1px solid #e1e8e2;border-radius:12px;padding:12px}.logo{color:#fff;border-radius:8px;padding:8px;font-size:10px;font-weight:bold}.hsbc{background:#db0011}.dbs{background:#d71920}.sc{background:#0876bb}.hs{background:#177951}.mox{background:#7058e8}.btn{border:0;border-radius:9px;padding:10px 12px;background:#12613a;color:white;font-weight:bold;cursor:pointer}.alt{background:#fff;color:#17221b;border:1px solid #dce4dd}.red{background:#fff0f0;color:#bd3030;border:1px solid #ffd0d0}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:820px}th,td{padding:10px;border-bottom:1px solid #e5eae6;text-align:left;font-size:14px}.tag{border-radius:20px;padding:4px 8px;font-size:12px;font-weight:bold}.paid{background:#e5f7e9;color:#18713a}.partial{background:#fff2d9;color:#a96400}.unpaid{background:#fff0f0;color:#bd3030}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}input,select,textarea{font:inherit;padding:10px;border:1px solid #d7dfd8;border-radius:9px}.modal{position:fixed;inset:0;background:#0007;padding:18px;overflow:auto}.modal .panel{max-width:720px;margin:4vh auto}.hide{display:none}@media(max-width:700px){.stats,.cards{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}}</style></head><body><main class="app"><h1>信用卡・定期管理 💳</h1><p class="sub">自動儲存於此瀏覽器｜只顯示卡尾四位</p><div class="bar"><span class="muted">Due 前 7 日未還會提示</span><div><button class="btn alt" id="backup">↓ 備份</button><button class="btn" onclick="form()">＋ 新增交易</button></div></div><div id="notice"></div><section class="stats"><div class="box">目前未還總額<b id="total">$0</b></div><div class="box">7 日內 Due 未還<b id="soon">$0</b></div><div class="box">未收定期利息<b id="pending">$0</b></div><div class="box">已收定期利息<b id="got">$0</b></div></section><section class="panel"><h2>信用卡</h2><div class="cards" id="cards"></div></section><section class="panel"><div class="bar"><h2>交易總表</h2><button class="btn" onclick="form()">＋ 新增交易</button></div><div class="scroll"><table><thead><tr><th>交易日</th><th>信用卡</th><th>金額</th><th>已還／尚欠</th><th>狀態</th><th>Due</th><th>定期到期</th><th>利息</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="panel"><h2>匯入備份</h2><input id="import" type="file" accept="application/json"></section></main><div id="modal" class="hide"></div><script>const K='ccfd_live_v1',C=[['hsbc','HSBC','1326'],['dbs','DBS','6003'],['sc','SC','1507'],['hs','Hang Seng','4505'],['mox','Mox','—']];let T=JSON.parse(localStorage.getItem(K)||'[]'),E=null,$=s=>document.querySelector(s),m=n=>'$'+Number(n||0).toLocaleString('en-HK',{maximumFractionDigits:2}),out=t=>Math.max(0,+t.amount-(+t.repaid||0)),ca=id=>C.find(x=>x[0]===id)||C[0],cn=id=>{let c=ca(id);return c[1]+' •••• '+c[2]},fmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit'}):'—',days=s=>{if(!s)return null;let a=new Date(s+'T12:00:00'),b=new Date;b.setHours(0,0,0,0);return Math.ceil((a-b)/864e5)};function save(){localStorage.setItem(K,JSON.stringify(T));render()}function render(){let q=T.reduce((a,t)=>a+out(t),0),w=T.filter(t=>out(t)&&days(t.due)>=0&&days(t.due)<=7).reduce((a,t)=>a+out(t),0),p=T.filter(t=>t.fixed&&!t.got).reduce((a,t)=>a+(+t.interest||0),0),g=T.filter(t=>t.fixed&&t.got).reduce((a,t)=>a+(+t.interest||0),0);$('#total').textContent=m(q);$('#soon').textContent=m(w);$('#pending').textContent=m(p);$('#got').textContent=m(g);$('#cards').innerHTML=C.map(c=>'<div class="card"><span class="logo '+c[0]+'">'+(c[1]=='Hang Seng'?'恒生':c[1])+'</span> <b>'+c[1]+' •••• '+c[2]+'</b><p><b>'+m(T.filter(t=>t.card===c[0]).reduce((a,t)=>a+out(t),0))+'</b><br><span class="muted">'+(c[0]=='mox'?'未持有':'尚欠金額')+'</span></p></div>').join('');let z=T.filter(t=>out(t)&&t.due&&days(t.due)<=7);$('#notice').innerHTML=z.length?'<div class="panel" style="background:#fff7df">⚠️ '+z.map(t=>cn(t.card)+' 尚欠 '+m(out(t))+'（'+(days(t.due)<0?'已逾期 '+-days(t.due)+' 日':days(t.due)+' 日後到期')+'）').join('；')+'</div>':'';$('#rows').innerHTML=T.length?T.map(t=>{let o=out(t),s=o===0?['已還','paid']:+t.repaid?['部分已還','partial']:['未還','unpaid'];return '<tr><td>'+fmt(t.date)+'</td><td>'+cn(t.card)+'</td><td>'+m(t.amount)+'</td><td>'+m(t.repaid)+'<br><span class="muted">尚欠 '+m(o)+'</span></td><td><span class="tag '+s[1]+'">'+s[0]+'</span></td><td>'+fmt(t.due)+'</td><td>'+(t.fixed?fmt(t.maturity):'—')+'</td><td>'+(t.fixed?m(t.interest)+(t.got?' ✅':' ⏳'):'—')+'</td><td><button class="btn alt" onclick="form(\''+t.id+'\')">編輯</button> <button class="btn red" onclick="del(\''+t.id+'\')">刪除</button></td></tr>'}).join(''):'<tr><td colspan="9" class="muted">仲未有交易。</td></tr>'}function form(id){E=id;let t=id?T.find(x=>x.id===id):{date:new Date().toISOString().slice(0,10),card:'hsbc',amount:'',repaid:'',due:'',fixed:false,maturity:'',interest:'',got:false,notes:''};$('#modal').className='modal';$('#modal').innerHTML='<div class="panel"><div class="bar"><h2>'+(id?'編輯':'新增')+'交易</h2><button class="btn alt" onclick="closeF()">✕</button></div><form id="f" class="form"><label class="field">交易日<input name="date" type="date" value="'+t.date+'" required></label><label class="field">信用卡<select name="card">'+C.filter(c=>c[0]!=='mox'||t.card==='mox').map(c=>'<option value="'+c[0]+'" '+(c[0]===t.card?'selected':'')+'>'+c[1]+' •••• '+c[2]+'</option>').join('')+'</select></label><label class="field">金額<input name="amount" type="number" min="0" step=".01" value="'+t.amount+'" required></label><label class="field">已還金額<input name="repaid" type="number" min="0" step=".01" value="'+t.repaid+'"></label><label class="field">Due 日期<input name="due" type="date" value="'+t.due+'"></label><label class="field">定期設定<span><input name="fixed" type="checkbox" '+(t.fixed?'checked':'')+'> 有開定期</span><span><input name="got" type="checkbox" '+(t.got?'checked':'')+'> 已收利息</span></label><label class="field">定期到期日<input name="maturity" type="date" value="'+t.maturity+'"></label><label class="field">銀行報的利息<input name="interest" type="number" min="0" step=".01" value="'+t.interest+'"></label><label class="field full">備註<textarea name="notes">'+t.notes+'</textarea></label><div class="full"><button class="btn">儲存交易</button></div></form></div>';$('#f').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),x={id:E||crypto.randomUUID(),date:f.get('date'),card:f.get('card'),amount:+f.get('amount'),repaid:+f.get('repaid')||0,due:f.get('due'),fixed:f.get('fixed')==='on',maturity:f.get('maturity'),interest:+f.get('interest')||0,got:f.get('got')==='on',notes:f.get('notes')};if(x.repaid>x.amount)return alert('已還金額唔可以大過交易金額');E?T=T.map(a=>a.id===E?x:a):T.push(x);save();closeF()}}function closeF(){$('#modal').className='hide'}function del(id){if(confirm('確定刪除？')){T=T.filter(t=>t.id!==id);save()}}$('#backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(T)],{type:'application/json'}));a.download='信用卡定期備份.json';a.click()};$('#import').onchange=e=>{let r=new FileReader;r.onload=()=>{try{T=JSON.parse(r.result);save()}catch{alert('備份檔格式唔啱')}};r.readAsText(e.target.files[0])};render()</script></body></html>

<!doctype html><html lang="zh-HK"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>信用卡・定期管理</title><style>body{margin:0;background:#f3f7f4;font-family:-apple-system,"PingFang HK",sans-serif;color:#17221b}.app{max-width:680px;margin:auto;padding:14px}.box,.tx{background:#fff;border:1px solid #dce6de;border-radius:14px;padding:14px;margin:10px 0}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}.btn{border:0;border-radius:9px;padding:10px 12px;background:#12613a;color:#fff;font-weight:bold}.alt{background:#fff;color:#17221b;border:1px solid #d4dfd6}.red{background:#fff0f0;color:#b52c2c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.num{font-size:21px;font-weight:bold}.muted{font-size:13px;color:#68736b}.tag{padding:4px 8px;border-radius:20px;background:#fff0f0;color:#b52c2c;font-size:12px;font-weight:bold}.row{display:flex;justify-content:space-between;gap:8px;margin:7px 0}.modal{position:fixed;inset:0;background:#0008;padding:14px;overflow:auto}.modal .box{max-width:600px;margin:5vh auto}.hide{display:none}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:4px}.full{grid-column:1/-1}input,select,textarea{font:inherit;padding:9px;border:1px solid #ced9d0;border-radius:8px}</style><body><main class="app"><div class="bar"><div><h1>信用卡・定期管理 💳</h1><span class="muted">版本 2026.09.13</span></div><button class="btn alt" id="refresh">↻ 更新 App</button></div><div class="grid"><div class="box">未還總額<div class="num" id="total">$0</div></div><div class="box">7 日內 Due<div class="num" id="soon">$0</div></div></div><section class="box"><b>信用卡週期</b><div id="cards"></div></section><section><div class="bar"><h2>未還交易</h2><button class="btn" id="add">＋ 新增</button></div><div id="items"></div></section></main><div id="modal" class="hide"></div><script src="app.js?v=9"></script></body></html>

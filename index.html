<!doctype html><html lang="zh-HK"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>信用卡・定期管理</title><style>body{font-family:-apple-system,"PingFang HK",sans-serif;background:#f4f7f4;margin:0;color:#17221b}.app{max-width:900px;margin:auto;padding:16px}.box{background:#fff;border:1px solid #dfe7e0;border-radius:14px;padding:14px;margin:12px 0}.bar{display:flex;justify-content:space-between;gap:9px;align-items:center;flex-wrap:wrap}.btn{padding:10px 13px;border:0;border-radius:9px;background:#12613a;color:white;font-weight:bold}.alt{background:#fff;color:#17221b;border:1px solid #d6dfd7}.red{background:#fff0f0;color:#b62b2b;border:1px solid #ffcccc}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.num{font-size:22px;font-weight:bold;margin-top:5px}.muted{color:#68736b;font-size:13px}table{border-collapse:collapse;width:100%;min-width:760px}th,td{border-bottom:1px solid #e5eae6;padding:9px;text-align:left;font-size:14px}.scroll{overflow:auto}.modal{position:fixed;inset:0;background:#0008;padding:16px;overflow:auto}.modal .box{max-width:650px;margin:5vh auto}.hide{display:none}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:4px}.full{grid-column:1/-1}input,select,textarea{font:inherit;padding:9px;border:1px solid #cfd9d0;border-radius:8px}@media(max-width:650px){.grid,.form{grid-template-columns:repeat(2,1fr)}.form .full{grid-column:1/-1}}</style><body><main class="app"><h1>信用卡・定期管理 💳</h1><p class="muted">資料自動儲存於此瀏覽器</p><div class="box bar"><span>Due 前 7 日未還會提示</span><span><button class="btn alt" id="backup">↓ 備份</button><button class="btn" id="add">＋ 新增交易</button></span></div><div class="grid"><div class="box">目前未還<div class="num" id="total">$0</div></div><div class="box">7 日內 Due<div class="num" id="soon">$0</div></div><div class="box">未收利息<div class="num" id="interest">$0</div></div><div class="box">已收利息<div class="num" id="received">$0</div></div></div><div class="box"><h2>信用卡</h2><div id="cardlist"></div></div><div class="box"><div class="bar"><h2>交易總表</h2><button class="btn" id="add2">＋ 新增交易</button></div><div class="scroll"><table><thead><tr><th>日期</th><th>信用卡</th><th>金額</th><th>尚欠</th><th>Due</th><th>定期到期</th><th>利息</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="box">匯入備份：<input id="import" type="file" accept="application/json"></div></main><div id="modal" class="hide"></div><script src="app.js?v=2"></script></body></html>

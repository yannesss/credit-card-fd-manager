<!doctype html><html lang="zh-HK"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>信用卡・定期管理</title><style>body{margin:0;background:#f4f7f4;font-family:-apple-system,"PingFang HK",sans-serif;color:#17221b}.app{max-width:1000px;margin:auto;padding:16px}.panel,.box{background:#fff;border:1px solid #dfe7e0;border-radius:14px;padding:14px;margin:12px 0}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.stats,.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.num{font-size:22px;font-weight:bold;margin-top:6px}.muted{font-size:13px;color:#667169}.btn{border:0;border-radius:9px;padding:10px 12px;background:#12613a;color:#fff;font-weight:bold}.alt{background:#fff;color:#17221b;border:1px solid #d5ded7}.red{background:#fff0f0;color:#b52727;border:1px solid #ffcccc}.card{border:1px solid #dfe7e0;border-radius:11px;padding:11px}.badge{border-radius:7px;color:#fff;padding:7px;font-size:10px;font-weight:bold}.hsbc{background:#db0011}.dbs{background:#d71920}.sc{background:#0876bb}.hs{background:#177951}.mox{background:#7058e8}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:780px}th,td{padding:9px;border-bottom:1px solid #e4e9e5;text-align:left;font-size:14px}.modal{position:fixed;inset:0;background:#0008;padding:15px;overflow:auto}.modal .panel{max-width:680px;margin:5vh auto}.hide{display:none}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.field{display:flex;flex-direction:column;gap:4px}.full{grid-column:1/-1}input,select,textarea{font:inherit;padding:9px;border:1px solid #cfd9d0;border-radius:8px}.paid{color:#19713d;font-weight:bold}.partial{color:#a56500;font-weight:bold}.unpaid{color:#b62b2b;font-weight:bold}@media(max-width:650px){.stats,.cards{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}}</style><body><main class="app"><h1>信用卡・定期管理 💳</h1><p class="muted">資料自動儲存於此瀏覽器</p><div class="panel bar"><span>Due 前 7 日未還會提示</span><span><button class="btn alt" id="backup">↓ 備份</button> <button class="btn" id="add">＋ 新增交易</button></span></div><div id="alert"></div><div class="stats"><div class="box">目前未還<div class="num" id="total">$0</div></div><div class="box">7 日內 Due<div class="num" id="soon">$0</div></div><div class="box">未收定期利息<div class="num" id="pending">$0</div></div><div class="box">已收利息<div class="num" id="got">$0</div></div></div><section class="panel"><h2>信用卡</h2><div class="cards" id="cards"></div></section><section class="panel"><div class="bar"><h2>交易總表</h2><button class="btn" id="add2">＋ 新增交易</button></div><div class="scroll"><table><thead><tr><th>交易日</th><th>信用卡</th><th>金額</th><th>已還／尚欠</th><th>狀態</th><th>Due</th><th>定期到期</th><th>利息</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="panel"><b>匯入備份</b><br><input id="import" type="file" accept="application/json"></section></main><div id="modal" class="hide"></div><script>const KEY='ccfd_final',C=[['hsbc','HSBC','1326'],['dbs','DBS','6003'],['sc','SC','1507'],['hs','Hang Seng','4505'],['mox','Mox','—']];let T=JSON.parse(localStorage.getItem(KEY)||'[]'),E=null;const q=x=>document.getElementById(x),cash=x=>'$'+Number(x||0).toLocaleString('en-HK',{maximumFractionDigits:2}),card=id=>C.find(x=>x[0]===id)||C[0],out=x=>Math.max(0,+x.amount-(+x.repaid||0)),fmt=x=>x?new Date(x+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit'}):'—',until=x=>{if(!x)return null;let a=new Date(x+'T12:00:00'),b=new Date();b.setHours(0,0,0,0);return Math.ceil((a-b)/86400000)};function save(){localStorage.setItem(KEY,JSON.stringify(T));draw()}function draw(){q('total').textContent=cash(T.reduce((a,x)=>a+out(x),0));q('soon').textContent=cash(T.filter(x=>out(x)&&until(x.due)>=0&&until(x.due)<=7).reduce((a,x)=>a+out(x),0));q('pending').textContent=cash(T.filter(x=>x.fixed&&!x.got).reduce((a,x)=>a+(+x.interest||0),0));q('got').textContent=cash(T.filter(x=>x.fixed&&x.got).reduce((a,x)=>a+(+x.interest||0),0));q('cards').innerHTML=C.map(c=>'<div class="card"><span class="badge '+c[0]+'">'+(c[1]==='Hang Seng'?'恒生':c[1])+'</span> <b>'+c[1]+' •••• '+c[2]+'</b><div class="num">'+cash(T.filter(x=>x.card===c[0]).reduce((a,x)=>a+out(x),0))+'</div><span class="muted">'+(c[0]==='mox'?'未持有':'尚欠金額')+'</span></div>').join('');let w=T.filter(x=>out(x)&&x.due&&until(x.due)<=7);q('alert').innerHTML=w.length?'<div class="panel" style="background:#fff8e6">⚠️ '+w.map(x=>card(x.card)[1]+' 尚欠 '+cash(out(x))+'（'+(until(x.due)<0?'已逾期 '+-until(x.due)+' 日':until(x.due)+' 日後到期')+'）').join('；')+'</div>':'';q('rows').innerHTML=T.length?T.map(x=>{let o=out(x),s=o===0?['已還','paid']:+x.repaid?['部分已還','partial']:['未還','unpaid'];return '<tr><td>'+fmt(x.date)+'</td><td>'+card(x.card)[1]+' •••• '+card(x.card)[2]+'</td><td>'+cash(x.amount)+'</td><td>'+cash(x.repaid)+'<br><span class="muted">尚欠 '+cash(o)+'</span></td><td class="'+s[1]+'">'+s[0]+'</td><td>'+fmt(x.due)+'</td><td>'+(x.fixed?fmt(x.maturity):'—')+'</td><td>'+(x.fixed?cash(x.interest)+(x.got?' ✅':' ⏳'):'—')+'</td><td><button class="btn alt" data-edit="'+x.id+'">編輯</button> <button class="btn red" data-del="'+x.id+'">刪除</button></td></tr>'}).join(''):'<tr><td colspan="9" class="muted">仲未有交易。</td></tr>'}function open(id){E=id;let x=id?T.find(a=>a.id===id):{date:new Date().toISOString().slice(0,10),card:'hsbc',amount:'',repaid:'',due:'',fixed:false,maturity:'',interest:'',got:false,notes:''};q('modal').className='modal';q('modal').innerHTML='<section class="panel"><div class="bar"><h2>'+(id?'編輯':'新增')+'交易</h2><button type="button" class="btn alt" id="close">✕</button></div><form id="f" class="form"><label class="field">交易日<input name="date" type="date" value="'+x.date+'" required></label><label class="field">信用卡<select name="card">'+C.filter(c=>c[0]!=='mox'||x.card==='mox').map(c=>'<option value="'+c[0]+'" '+(c[0]===x.card?'selected':'')+'>'+c[1]+' •••• '+c[2]+'</option>').join('')+'</select></label><label class="field">金額<input name="amount" type="number" min="0" step=".01" value="'+x.amount+'" required></label><label class="field">已還金額<input name="repaid" type="number" min="0" step=".01" value="'+x.repaid+'"></label><label class="field">Due 日期<input name="due" type="date" value="'+x.due+'"></label><label class="field">定期設定<span><input name="fixed" type="checkbox" '+(x.fixed?'checked':'')+'> 有開定期</span><span><input name="got" type="checkbox" '+(x.got?'checked':'')+'> 已收利息</span></label><label class="field">定期到期日<input name="maturity" type="date" value="'+x.maturity+'"></label><label class="field">銀行提供利息<input name="interest" type="number" min="0" step=".01" value="'+x.interest+'"></label><label class="field full">備註<textarea name="notes">'+x.notes+'</textarea></label><div class="full"><button class="btn">儲存交易</button></div></form></section>';q('close').onclick=()=>q('modal').className='hide';q('f').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),z={id:E||crypto.randomUUID(),date:f.get('date'),card:f.get('card'),amount:+f.get('amount'),repaid:+f.get('repaid')||0,due:f.get('due'),fixed:f.get('fixed')==='on',maturity:f.get('maturity'),interest:+f.get('interest')||0,got:f.get('got')==='on',notes:f.get('notes')};if(z.repaid>z.amount)return alert('已還金額唔可以大過交易金額');E?T=T.map(a=>a.id===E?z:a):T.push(z);save();q('modal').className='hide'}}q('add').onclick=()=>open();q('add2').onclick=()=>open();q('rows').onclick=e=>{let id=e.target.dataset.edit||e.target.dataset.del;if(!id)return;if(e.target.dataset.edit)open(id);else if(confirm('確定刪除？')){T=T.filter(x=>x.id!==id);save()}};q('backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(T)],{type:'application/json'}));a.download='信用卡定期備份.json';a.click()};q('import').onchange=e=>{let r=new FileReader();r.onload=()=>{try{T=JSON.parse(r.result);save()}catch{alert('備份檔格式唔啱')}};r.readAsText(e.target.files[0])};draw()</script></body></html>

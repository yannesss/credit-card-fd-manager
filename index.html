<meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>信用卡管理</title><style>body{font:16px sans-serif;max-width:600px;margin:auto;padding:16px;background:#f4f7f4}.x{background:#fff;border-radius:12px;padding:14px;margin:10px 0}input,select,button{padding:10px;margin:4px;border-radius:8px;border:1px solid #ccc}button{background:#17643d;color:#fff;border:0}#app{display:none}#err{color:#b00;white-space:pre-wrap}</style><div id=login class=x><h1>信用卡・定期管理</h1><p>登入後，資料只會同步到你自己的帳戶。</p><button id=signin>使用 Google 登入</button><p id=err></p></div><main id=app><div class=x><b id=user></b> <button id=signout>登出</button><h1>信用卡・定期管理</h1><p id=status>雲端同步中</p></div><div class=x><h3>新增／編輯交易</h3><form id=form><input id=id type=hidden><select id=card><option>HSBC •••• 1326</option><option>SC BANK •••• 1507</option><option>DBS •••• 6003</option><option>HANG SENG •••• 4505</option></select><input id=date type=date required><input id=amt type=number placeholder='金額 HK$' required><input id=due type=date><input id=interest type=number placeholder='利息 HK$'><label><input id=paid type=checkbox> 已還</label><button>儲存</button></form></div><div class=x><h3>交易紀錄</h3><div id=list></div></div></main><script type=module>import{initializeApp}from'https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js';import{getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot}from'https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js';const cfg={apiKey:'AIzaSyBaC_HqrjAyQ0shh9mDtYAcNlE0EapORp8',authDomain:'credit-card-fd-manager.firebaseapp.com',projectId:'credit-card-fd-manager',appId:'1:350413127111:web:af03eeb7deb7f94173ede2'};const app=initializeApp(cfg),au=getAuth(app),db=getFirestore(app);let u,D=[];const $=x=>document.getElementById(x);$('signin').addEventListener('click',()=>{$('err').textContent='';signInWithPopup(au,new GoogleAuthProvider()).catch(e=>{$('err').textContent='登入失敗：'+e.code})});$('signout').addEventListener('click',()=>signOut(au));onAuthStateChanged(au,x=>{if(!x){$('login').style.display='block';$('app').style.display='none';return}u=x.uid;$('login').style.display='none';$('app').style.display='block';$('user').textContent=x.email;onSnapshot(collection(db,'users',u,'transactions'),s=>{D=s.docs.map(d=>d.data());$('list').innerHTML=D.sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<p>${x.card}｜${x.date}｜$${x.amt}｜Due ${x.due||'-'}｜利息 $${x.interest||0} ${x.paid?'已還':''} <button data-e='${x.id}'>編輯</button><button data-d='${x.id}'>刪除</button></p>`).join('')||'未有紀錄';$('status').textContent='✓ 雲端已同步｜'+new Date().toLocaleString('zh-HK')},e=>{$('status').textContent='同步錯誤：'+e.message})});$('form').addEventListener('submit',async e=>{e.preventDefault();const x={id:$('id').value||crypto.randomUUID(),card:$('card').value,date:$('date').value,amt:$('amt').value,due:$('due').value,interest:$('interest').value||0,paid:$('paid').checked,updated:Date.now()};await setDoc(doc(db,'users',u,'transactions',x.id),x);$('form').reset();$('id').value=''});$('list').addEventListener('click',async e=>{const x=D.find(d=>d.id===e.target.dataset.e);if(x){$('id').value=x.id;$('card').value=x.card;$('date').value=x.date;$('amt').value=x.amt;$('due').value=x.due;$('interest').value=x.interest;$('paid').checked=x.paid}if(e.target.dataset.d)await deleteDoc(doc(db,'users',u,'transactions',e.target.dataset.d))});</script>

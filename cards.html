<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>信用卡周期・管理</title><style>:root{--ink:#17221b;--green:#12613a;--pale:#f4f7f4;--line:#dce6df;--muted:#657167}*{box-sizing:border-box}body{margin:0;background:var(--pale);font:15px -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",sans-serif;color:var(--ink)}main,section{max-width:700px;margin:auto;padding:16px 16px 90px}.box,article,form{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin:11px 0;box-shadow:0 2px 9px #18351a08}.hero,.row{display:flex;justify-content:space-between;gap:9px;align-items:center}.hero h1{font-size:24px;margin:0}.muted{font-size:13px;color:var(--muted)}h2{font-size:20px;margin:0 0 10px}button{appearance:none;border:0;border-radius:10px;padding:10px 12px;background:#e7eee8;color:var(--ink);font:inherit;font-weight:650;cursor:pointer}button.main{background:var(--green);color:#fff}button.danger{background:#ffeaea;color:#a11616}.hide{display:none!important}input,select,textarea{width:100%;margin:4px 0 11px;padding:11px;border:1px solid #cad7cd;border-radius:9px;background:#fff;font:inherit;color:var(--ink)}label{font-size:13px;font-weight:700}.check{display:flex;gap:7px;align-items:center;margin:3px 0 10px}.check input{width:auto;margin:0}.cards .row{padding:11px 0;border-bottom:1px solid #edf1ed}.cards .row:last-child{border:0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}.cardedit{border-left:5px solid #12613a}.nav{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 15px;margin:11px 0}.nav a{color:var(--green);font-weight:700;text-decoration:none}@media(min-width:560px){.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}}</style></head><body><section id="login"><div class="box"><h1>信用卡周期・管理</h1><p>請先在首頁登入 Google 帳戶。</p><a href="index.html"><button class="main">返回首頁登入</button></a><p id="err"></p></div></section><main id="app" class="hide"><div class="nav"><a href="index.html">← 返回首頁</a><b>信用卡周期・管理</b></div><div class="box"><h2>信用卡周期</h2><div class="cards" id="cards"></div></div><div class="box"><h2>信用卡管理</h2><p class="muted">新增、修改或停用卡片；停用不會影響已有交易記錄。</p><form id="cardform"><input id="cid" type="hidden"><div class="formgrid"><div><label>銀行／信用卡名稱 *</label><input id="cname" required placeholder="例如：SC BANK"></div><div><label>尾號 4 碼 *</label><input id="clast" required inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="例如：1507"></div><div><label>每月結單日</label><input id="cstmt" type="number" min="1" max="31" placeholder="例如：10"></div><div><label>每月 Due 日（結單後下月）</label><input id="cdue" type="number" min="1" max="31" placeholder="例如：18"></div><div><label>信用額（HK$）</label><input id="climit" type="number" min="0" step="0.01"></div><div><label>每期可套現額（HK$）</label><input id="ccash" type="number" min="0" step="0.01"></div><div class="check"><input id="cactive" type="checkbox" checked><label for="cactive">使用中</label></div></div><div class="actions"><button class="main" type="submit">儲存信用卡</button><button class="danger hide" type="button" id="cdel">刪除卡片</button><button type="button" id="ccancel">取消</button></div></form><div id="cardlist"></div></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js';import{getAuth,GoogleAuthProvider,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js';import{getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot,getDocs}from'https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js';const cfg={apiKey:'AIzaSyBaC_HqrjAyQ0shh9mDtYAcNlE0EapORp8',authDomain:'credit-card-fd-manager.firebaseapp.com',projectId:'credit-card-fd-manager',appId:'1:350413127111:web:af03eeb7deb7f94173ede2'};const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);const defaults=[['hsbc1326','HSBC','1326',18,14,89000,3000],['sc1507','SC BANK','1507',10,6,21000,20000],['dbs6003','DBS','6003',22,18,60000,10000],['hang4505','HANG SENG','4505',15,10,32000,0]];let uid='',cards=[];const $=id=>document.getElementById(id),money=x=>'HK$'+(+x||0).toLocaleString('en-HK',{maximumFractionDigits:2}),esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const label=c=>`${c.name} •••• ${c.last4}`;function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}function localISO(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(Math.min(d,daysInMonth(y,m))).padStart(2,'0')}`}function localFmt(iso){if(!iso)return '—';const[a,m,d]=iso.split('-').map(Number);return `${d}/${m}/${a}`}function todayParts(){const n=new Date();return[n.getFullYear(),n.getMonth(),n.getDate()]}function nextStatement(day){if(!day)return '';let[y,m,t]=todayParts(),x=localISO(y,m,+day);if(+x.slice(-2)<t){m++;if(m===12){m=0;y++}x=localISO(y,m,+day)}return x}function dueForStatement(statementISO,dueDay){if(!statementISO||!dueDay)return '';let[y,m]=statementISO.split('-').map(Number);m++;if(m===13){m=1;y++}return localISO(y,m-1,+dueDay)}function nextCycle(c){const statement=nextStatement(c.statementDay);return{statement,due:dueForStatement(statement,c.dueDay)}}function cardForm(c={}){$('cid').value=c.id||'';$('cname').value=c.name||'';$('clast').value=c.last4||'';$('cstmt').value=c.statementDay||'';$('cdue').value=c.dueDay||'';$('climit').value=c.limit||'';$('ccash').value=c.cash||'';$('cactive').checked=c.active!==false;$('cdel').classList.toggle('hide',!c.id)}function render(){$('cards').innerHTML=cards.map(c=>{const k=nextCycle(c);return`<div class="row"><span><b>${esc(label(c))}</b><br><span class="muted">結單：${localFmt(k.statement)}｜Due：${localFmt(k.due)}${c.active===false?'｜已停用':''}</span></span><span class="muted">額度 ${money(c.limit)}<br>可套現 ${c.cash?money(c.cash):'—'}</span></div>`}).join('')||'<p class="muted">未有信用卡。</p>';$('cardlist').innerHTML=cards.map(c=>`<article class="cardedit"><div class="row"><b>${esc(label(c))}</b><span>${c.active===false?'已停用':'使用中'}</span></div><p class="muted">每月結單日：${c.statementDay||'—'}｜每月 Due 日（結單後下月）：${c.dueDay||'—'}｜額度：${money(c.limit)}</p><button data-cardedit="${c.id}">修改</button></article>`).join('')||'<p class="muted">未有信用卡。</p>'}async function ensureDefaults(){const s=await getDocs(collection(db,'users',uid,'cards'));if(!s.empty)return;await Promise.all(defaults.map(([id,name,last4,statementDay,dueDay,limit,cash])=>setDoc(doc(db,'users',uid,'cards',id),{id,name,last4,statementDay,dueDay,limit,cash,active:true,created:Date.now()})))}onAuthStateChanged(auth,async user=>{if(!user){$('login').classList.remove('hide');$('app').classList.add('hide');return}uid=user.uid;$('login').classList.add('hide');$('app').classList.remove('hide');await ensureDefaults();onSnapshot(collection(db,'users',uid,'cards'),s=>{cards=s.docs.map(d=>d.data());cardForm();render()})});$('cardform').onsubmit=async e=>{e.preventDefault();const id=$('cid').value||crypto.randomUUID(),x={id,name:$('cname').value.trim(),last4:$('clast').value.trim(),statementDay:+$('cstmt').value||0,dueDay:+$('cdue').value||0,limit:+$('climit').value||0,cash:+$('ccash').value||0,active:$('cactive').checked,updated:Date.now()};await setDoc(doc(db,'users',uid,'cards',id),x);cardForm()};$('ccancel').onclick=()=>cardForm();$('cdel').onclick=async()=>{const id=$('cid').value;if(id&&confirm('確定刪除這張卡？已有交易不會被刪除。')){await deleteDoc(doc(db,'users',uid,'cards',id));cardForm()}};$('cardlist').onclick=e=>{const id=e.target.dataset.cardedit;if(id){const x=cards.find(c=>c.id===id);if(x){cardForm(x);window.scrollTo({top:document.querySelector('#cardform').getBoundingClientRect().top+scrollY-20,behavior:'smooth'})}}};</script></body></html>
